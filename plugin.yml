name: MEBImgScreen
main: MengBao\MEBAdScreen\Main
version: 1.0.0
api:
- 5.0.0
load: POSTWORLD
author: MengBao
website: https://github.com/MengBaofh/MEBImgScreen
description: Use colored blocks to build pixel art screens from images.
commands:
 imgscreen:
  description: Managing image screens
  permission: imgscreen.admin
  usage: '/imgscreen <make|create|remove|list|info|reload>'
  aliases:
  - imgs

permissions:
 imgscreen.admin:
  default: op
  description: Manage image screens
